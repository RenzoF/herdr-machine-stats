id = "renzof.herdr-machine-stats"
name = "machine stats"
version = "0.4.3"
min_herdr_version = "0.9.0"
description = "Live CPU, memory, disk and agent status for every machine Herdr knows, with btop drill-down"
platforms = ["linux", "macos"]

# Full-screen dashboard inside Herdr. Commands run from this directory.
[[panes]]
id = "dashboard"
title = "machine stats"
placement = "zoomed"
command = ["python3", "bin/machine-stats"]
platforms = ["linux", "macos"]

# What waits on you, on every machine: a popup over whatever you do.
[[panes]]
id = "needs"
title = "needs you"
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "bin/machine-stats", "--needs"]
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open machine stats"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "renzof.herdr-machine-stats", "--entrypoint", "dashboard", "--placement", "zoomed", "--focus"]
platforms = ["linux", "macos"]

[[actions]]
id = "needs"
title = "Show what needs you"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "renzof.herdr-machine-stats", "--entrypoint", "needs", "--placement", "popup", "--focus"]
platforms = ["linux", "macos"]
